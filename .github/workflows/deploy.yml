name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and Build
        working-directory: ./segofi-frontend
        run: |
          npm ci
          npx ng build --configuration production --base-href /SegOfi-Sectur/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./segofi-frontend/dist/segofi-frontend/browser # Cambia esta ruta si tu carpeta dist es distinta

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
